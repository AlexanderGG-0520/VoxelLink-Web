services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voxellink
      POSTGRES_USER: voxellink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "server/migrate.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      VOXELLINK_MONITOR_TOKEN: ${VOXELLINK_MONITOR_TOKEN:?set VOXELLINK_MONITOR_TOKEN in .env}
      VOXELLINK_MONITOR_IMPORT_URL: ${VOXELLINK_MONITOR_IMPORT_URL:-}
      VOXELLINK_MONITOR_IMPORT_TOKEN: ${VOXELLINK_MONITOR_IMPORT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    build: .
    depends_on:
      api: { condition: service_started }
    ports: ["${WEB_PORT:-8080}:80"]
volumes:
  postgres-data:

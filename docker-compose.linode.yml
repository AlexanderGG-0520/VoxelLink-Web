# Linode deployment overlay. It makes the public web service reachable by the
# existing cloudflared container and exposes PostgreSQL only to Monitor on a
# separate private Docker network.
services:
  api:
    environment:
      VOXELLINK_MONITOR_IMPORT_URL: http://monitor-api:8080
      VOXELLINK_MONITOR_PUBLIC_URL: http://monitor-api:8080
    networks:
      default: {}
      voxellink-edge:
        aliases: [voxellink-api]
  web:
    networks:
      - default
      - voxellink-edge
  postgres:
    networks:
      default: {}
      voxellink-data:
        aliases: [voxellink-postgres]

networks:
  voxellink-edge:
    external: true
  voxellink-data:
    external: true
